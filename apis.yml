description: >-
  The Hong Kong University of Science and Technology (HKUST) is a public research university
  in Clear Water Bay, Hong Kong SAR. Its programmable footprint is real but small and mostly
  closed. One API on an HKUST host is public and keyless: the Path Advisor campus wayfinding
  API at pathadvisor.ust.hk, which serves buildings, calibrated floor plans, point-of-interest
  categories and named map nodes with GeoJSON footprints, CORS-open and with no key. Beyond
  it, the IT Services Office runs an Azure API Management gateway and portal — live and
  callable at hkust.azure-api.net, but every product needs an ITSO account, a subscription
  request and human approval, and the catalog cannot be enumerated anonymously. DataSpace@HKUST
  is a Dataverse 6.1 instance HKUST self-hosts on its own domain and network, serving 151
  published datasets over the upstream Dataverse Native API; its OAI-PMH provider is switched
  off. The institution's most substantial machine-readable assets are not developer APIs at
  all: a Shibboleth SAML identity provider published into eduGAIN through the Hong Kong Access
  Federation, and HKUST Library's Crossref membership under DOI prefix 10.14711, with 14,453
  registered records. HKUST publishes no OpenAPI, no changelog, no status page and no
  security.txt for any of it. A previously catalogued API base URL of api.ust.hk does not
  exist — HKUST's own authoritative nameservers return NXDOMAIN for that hostname — and has
  been removed.
