  - aid: hkust:dataspace
    name: DataSpace@HKUST Research Data Repository API
    x-operator: institution
    description: >-
      The institutional research data repository, running Dataverse 6.1 on Payara. HKUST
      self-hosts it: dataspace.hkust.edu.hk is on the university's own registrable domain and
      CNAMEs to lbnx99.ust.hk on HKUST's own network, so the deployment and its operation are
      genuinely HKUST's. The API contract is not — it is the upstream Dataverse Native REST
      API, and this repository deliberately does NOT republish Dataverse's generic
      specification under HKUST's name. Unauthenticated reads work: /api/info/version and
      /api/search answer without credentials across 151 published datasets, with DOIs under
      HKUST Library's own Crossref prefix 10.14711. The OAI-PMH provider Dataverse ships is
      switched off and returns 503 "OAI Service is disabled on this Dataverse".
    humanURL: https://dataspace.hkust.edu.hk/
    baseURL: https://dataspace.hkust.edu.hk/api
    tags: [ Research Data, Repository, Dataverse, Open Data, DOI ]
    properties:
      - type: Documentation
        url: https://guides.dataverse.org/en/latest/api/native-api.html
      - type: Conformance
        url: conformance/hkust-conformance.yml
  - aid: hkust:identity-federation
    name: HKUST Shibboleth Identity Provider
    x-operator: institution
    description: >-
      HKUST's own SAML 2.0 identity provider, serving machine-readable metadata at
      idp.ust.hk/idp/shibboleth. Asserts the scopes ust.hk, connect.ust.hk and alumni.ust.hk,
      and declares HTTP-POST, HTTP-POST-SimpleSign, HTTP-Redirect and SOAP/ECP single-sign-on
      bindings alongside the legacy Shibboleth 1.0 profile. Registered by the Hong Kong Access
      Federation on 2017-01-07 and published into eduGAIN carrying the REFEDS Research &
      Scholarship entity category and the SIRTFI security-incident-response framework, with a
      security contact of security@ust.hk. This is institution-operated by definition and is
      the most substantial machine-readable surface HKUST runs — and it is not a developer API,
      which is the characteristic shape of a university's real programmable footprint.
    humanURL: https://www.hkaf.edu.hk/
    baseURL: https://idp.ust.hk/idp/shibboleth
    tags: [ Identity Federation, SAML, Shibboleth, eduGAIN, Single Sign-On ]
    properties:
      - type: Metadata
        url: https://idp.ust.hk/idp/shibboleth
      - type: Documentation
        url: https://technical.edugain.org/api.php?action=show_entity&entityid=https://idp.ust.hk/idp/shibboleth
      - type: Authentication
        url: authentication/hkust-authentication.yml
  - aid: hkust:crossref-doi
    name: HKUST Library Crossref DOI Registration
    x-operator: tenant
    description: >-
      HKUST Library is Crossref member 5801 and owns DOI prefix 10.14711, under which 14,453
      records are registered and retrievable through the Crossref REST API — including the
      dataset DOIs minted by DataSpace@HKUST and the library's own special-collections
      material. The registration, the prefix and the deposited metadata are HKUST Library's;
      the API serving them is Crossref's, which is why this is recorded as a tenant
      relationship and no Crossref specification is saved under HKUST's name. Worth noting
      that this is a Crossref rather than a DataCite registration, which is unusual for an
      institutional research-data repository.
    humanURL: https://library.hkust.edu.hk/
    baseURL: https://api.crossref.org/prefixes/10.14711
    tags: [ Library, Scholarly Metadata, DOI, Crossref, Research ]
    properties:
      - type: Documentation
        url: https://api.crossref.org/prefixes/10.14711
      - type: Conformance
        url: conformance/hkust-conformance.yml
  - aid: hkust:open-data-platform
    name: HKUST Open Data Platform
    x-operator: institution
    description: >-
      Central Elastic Stack repository established by ITSO to collect, search and visualise
      smart-campus data, including the IoT sensor inventory and sensor readings. It is
      institution-operated, but there is no open self-service endpoint: the data is reached
      only through the HKUST API Gateway with a subscription key issued after review, and no
      separate public API reference is published beyond the IoT retrieval walkthrough.
    humanURL: https://itso.hkust.edu.hk/services/it-infrastructure/smart-campus-infrastructure/open-data-platform
    tags: [ Open Data, Smart Campus, Elastic Stack, IoT, Analytics ]
    properties:
