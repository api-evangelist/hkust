  - aid: hkust:api-gateway
    name: HKUST API Gateway and API Portal
    x-operator: tenant
    description: >-
      HKUST's Azure API Management tenant, operated by the IT Services Office. The gateway is
      live and callable at hkust.azure-api.net and returns the Azure APIM 401 "missing
      subscription key" on the two products HKUST documents publicly — sensor-data and
      sensor-inventory, the IoT feeds from the Open Data Platform. Access requires an ITSO
      account, a Product subscription request, and approval by email; keys travel in the
      X-Apim-Subscription-Key header. The developer portal is the stock Azure APIM portal and
      lists nothing to an anonymous visitor. Recorded as tenant: HKUST chose and configures
      the platform, but hkust.azure-api.net is a subdomain of Microsoft's azure-api.net and
      the gateway contract is Azure API Management's. The previously catalogued base URL
      https://api.ust.hk is NXDOMAIN on HKUST's own nameservers and has been removed.
    humanURL: https://hkust.developer.azure-api.net/
    baseURL: https://hkust.azure-api.net
    tags: [ API Gateway, Azure API Management, Developer Portal, Campus, IoT ]
    properties:
