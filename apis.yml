apis:
  - aid: hkust:path-advisor
    name: HKUST Path Advisor API
    x-operator: institution
    description: >-
      Public, keyless JSON API behind HKUST Path Advisor, the university's campus wayfinding
      service. Serves the campus spatial model: 7 buildings, 43 calibrated floor plans with
      metres-per-pixel and origin offsets, 26 point-of-interest categories, and named nodes
      carrying GeoJSON MultiPolygon footprints. Runs on HKUST's own domain and network
      (pathadvisor.ust.hk, 143.89.15.35), names no vendor anywhere in its responses or
      headers, and answers unauthenticated with Access-Control-Allow-Origin *. One route,
      /connectors, is gated behind an unpublished authorization scheme. HKUST publishes no
      OpenAPI for it; the description in this repository was written from live probes on
      2026-08-30 and is a third-party observation, not an HKUST artifact.
    humanURL: https://pathadvisor.ust.hk/
    baseURL: https://pathadvisor.ust.hk/api
    tags: [ Wayfinding, Campus, Geospatial, Open Data, Smart Campus ]
