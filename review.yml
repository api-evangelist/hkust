- date: '2026-08-30'
  rating: 3
  summary: 'University-pipeline re-profile with operator attribution settled before anything was saved.
    Three corrections and one real find. CORRECTION 1: the catalogued API base URL https://api.ust.hk
    does not exist — HKUST''s own authoritative nameservers (ustsu1/ustsu2.ust.hk) return NXDOMAIN — and
    the real, live gateway host is https://hkust.azure-api.net, named in HKUST''s own IoT documentation
    and returning the Azure APIM 401 ''missing subscription key''. CORRECTION 2: five common[] pointers
    credited to HKUST were the Dataverse project''s own GitHub artifacts (IssueTracker, Releases, SecurityPolicy,
    CodeOfConduct, ContributionGuide on github.com/IQSS/dataverse) — HKUST was being credited with IQSS''s
    security policy and code of conduct. Removed. CORRECTION 3: the rate-limits artifact described throttling
    on OAI-PMH and IIIF endpoints that do not exist here. THE FIND: pathadvisor.ust.hk/api is a genuine
    institution-operated, public, keyless, CORS-open JSON API on HKUST''s own domain and network, serving
    the campus spatial model. It carries a full artifact set written from live probes. Two further institution-operated
    machine-readable surfaces were verified and were previously uncatalogued: the Shibboleth SAML identity
    provider at idp.ust.hk, registered by the Hong Kong Access Federation into eduGAIN with REFEDS R&S
    and SIRTFI entity categories; and HKUST Library''s Crossref membership (member 5801, prefix 10.14711,
    14,453 records). Two negatives confirmed rather than assumed: the DataSpace OAI-PMH provider is explicitly
    disabled, and the DOI prefix is registered with Crossref, not DataCite.'
